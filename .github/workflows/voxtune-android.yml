name: VoxTune APK

on:
  push:
    paths: ["voxtune/**", ".github/workflows/voxtune-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voxtune
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Tests + build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk VoxTune.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoxTune-apk
          path: voxtune/VoxTune.apk
      - name: Publier une release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voxtune-v${{ github.run_number }}
          name: VoxTune ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: voxtune/VoxTune.apk
