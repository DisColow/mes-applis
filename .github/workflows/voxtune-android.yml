name: VoxTune APK

# Compile l'APK à chaque modification de l'appli (ou à la demande depuis l'onglet Actions),
# puis le publie en artefact et dans une release GitHub téléchargeable depuis le téléphone.
on:
  push:
    paths: ["voxtune/**", ".github/workflows/voxtune-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voxtune-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voxtune
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Le SDK Android est préinstallé sur les machines ubuntu-latest (ANDROID_HOME) ;
      # Gradle télécharge seul la plateforme et les build-tools manquants.
      - name: Tests du moteur audio
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilation de l'APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk VoxTune.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoxTune-${{ env.VERSION }}-apk
          path: voxtune/VoxTune.apk

      - name: Publier une release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voxtune-v${{ env.VERSION }}-${{ github.run_number }}
          name: VoxTune ${{ env.VERSION }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Ouvrez **VoxTune.apk** sur votre téléphone Android (10 ou plus) pour l'installer.
            Compilé depuis `${{ github.ref_name }}` @ ${{ github.sha }}.
          files: voxtune/VoxTune.apk
